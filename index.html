<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rainbow Adventures Wildlife Gallery</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#243229;background:#fff}.wrap{max-width:1100px;margin:auto;padding:18px}h2{text-align:center;color:#8a7044;margin:8px 0}p.intro{text-align:center;color:#536052;margin:0 0 24px}.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.tile{border:0;background:#f6f3ec;padding:0;cursor:pointer;text-align:left;border-radius:8px;overflow:hidden;color:inherit}.tile img{width:100%;height:205px;object-fit:cover;display:block}.tile span{display:block;padding:12px;font-weight:bold}.tile:focus-visible,.close:focus-visible,.nav:focus-visible{outline:3px solid #ba914e;outline-offset:2px}.overlay[hidden]{display:none}.overlay{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:9999;display:flex;align-items:center;justify-content:center;padding:60px 52px 65px}.figure{max-width:100%;max-height:100%;display:flex;flex-direction:column;align-items:center;gap:12px}.figure img{max-width:100%;max-height:calc(100vh - 160px);object-fit:contain}.caption{color:white;text-align:center;line-height:1.5}.close,.nav{border:0;color:white;background:rgba(255,255,255,.15);border-radius:50%;width:40px;height:40px;font-size:27px;cursor:pointer;position:absolute}.close{top:12px;right:15px}.prev{left:8px}.next{right:8px}@media(max-width:700px){.gallery{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tile img{height:145px}.overlay{padding:55px 40px}.tile span{font-size:13px}}@media(max-width:400px){.gallery{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><h2>Wildlife & Nature Gallery</h2><p class="intro">Moments from the Wild – Through Our Lens</p><div class="gallery" id="gallery"></div></main><div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="Enlarged wildlife photograph" hidden><button class="close" id="close" aria-label="Close photo">×</button><button class="nav prev" id="prev" aria-label="Previous photo">‹</button><div class="figure"><img id="large" alt=""><div class="caption" id="caption"></div></div><button class="nav next" id="next" aria-label="Next photo">›</button></div><script>
// REPLACE each image URL with the PUBLIC DIRECT IMAGE URL of your own photo.
// The placeholder URLs below are intentionally invalid until you add your photos.
const photos=[
 {src:'077A1037.jpg',title:'Bengal Tiger',scientific:'Panthera tigris',place:'Tadoba-Andhari Tiger Reserve'},
 {src:'IMG-20150527-WA0003.jpg',title:'Indian Peafowl',scientific:'Pavo cristatus',place:'Location of your photograph'},
 {src:'PASTE_PUBLIC_IMAGE_URL_3',title:'Spotted Deer',scientific:'Axis axis',place:'Location of your photograph'},
 {src:'PASTE_PUBLIC_IMAGE_URL_4',title:'Wildlife Photograph 4',scientific:'',place:'Location of your photograph'},
 {src:'PASTE_PUBLIC_IMAGE_URL_5',title:'Wildlife Photograph 5',scientific:'',place:'Location of your photograph'},
 {src:'PASTE_PUBLIC_IMAGE_URL_6',title:'Wildlife Photograph 6',scientific:'',place:'Location of your photograph'}
];
const gallery=document.getElementById('gallery'),overlay=document.getElementById('overlay'),large=document.getElementById('large'),caption=document.getElementById('caption');let current=0,lastFocus=null;
photos.forEach((p,i)=>{const b=document.createElement('button');b.className='tile';b.type='button';const img=document.createElement('img');img.src=p.src;img.alt=p.title;img.loading='lazy';const label=document.createElement('span');label.textContent=p.title;b.append(img,label);b.addEventListener('click',()=>{lastFocus=b;show(i);overlay.hidden=false;document.getElementById('close').focus()});gallery.appendChild(b)});
function show(i){current=(i+photos.length)%photos.length;const p=photos[current];large.src=p.src;large.alt=p.title;caption.textContent=p.title+(p.scientific?' ('+p.scientific+')':'')+(p.place?' — '+p.place:'')}
function close(){overlay.hidden=true;large.removeAttribute('src');if(lastFocus)lastFocus.focus()}
document.getElementById('close').onclick=close;document.getElementById('prev').onclick=()=>show(current-1);document.getElementById('next').onclick=()=>show(current+1);overlay.addEventListener('click',e=>{if(e.target===overlay)close()});document.addEventListener('keydown',e=>{if(overlay.hidden)return;if(e.key==='Escape')close();else if(e.key==='ArrowRight')show(current+1);else if(e.key==='ArrowLeft')show(current-1);else if(e.key==='Tab'){const buttons=[document.getElementById('close'),document.getElementById('prev'),document.getElementById('next')];if(e.shiftKey&&document.activeElement===buttons[0]){e.preventDefault();buttons[2].focus()}else if(!e.shiftKey&&document.activeElement===buttons[2]){e.preventDefault();buttons[0].focus()}}});
</script></body></html>
